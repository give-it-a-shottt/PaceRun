# 개발용 Postgres. 접속 정보는 레포에 적지 않고 루트의 .env에서 읽는다(.env.example 참고).
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 다른 프로젝트의 Postgres(5432)와 겹치지 않게 호스트 포트를 따로 쓴다
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pacerun-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pacerun-db:
